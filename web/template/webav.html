<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>k streaming | {{file_name}}</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/logo.png" type="image/x-icon">
  <meta name="description" content="Stream high-quality videos and movies in 1080p. Experience seamless playback with multiple player options." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- External CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.plyr.io/3.6.12/plyr.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://av-bo-tz.vercel.app/548/551/play.css" rel="stylesheet" />
</head>

<body class="bg-dark text-light">
  <div class="d-flex flex-column min-vh-100">

    <!-- Header -->
    <header class="bg-primary text-white py-2 shadow"
      style="background-color: {{ colours.header.background }} !important; color: {{ colours.header.color }} !important;">
      <div class="d-flex justify-content-between align-items-center container">
        <h1 class="h4 mb-0 fw-bold">{{template_ne}}</h1>
        <button id="theme-toggle-btn" class="btn btn-light theme-toggle-btn">
          <i class="fa-solid fa-sun"></i> Light Mode
        </button>
      </div>
    </header>

    <!-- Main content -->
    <main class="flex-grow-1 container py-3">

      <!-- Video Player -->
      <div class="player-wrapper mb-3">
        <video id="myVideo" src="{{file_url}}" class="w-100" controls></video>
        <script src="https://cdn.plyr.io/3.6.12/plyr.js"></script>
      </div>

      <!-- Player Buttons -->
      <div class="d-flex justify-content-between mb-2 flex-wrap gap-2">
        <a onclick="mx_player()" class="btn btn-primary flex-fill"
          style="border:none;background-color:{{ colours.mx_player.background }};color:{{ colours.mx_player.color }};">
          <i class="fa fa-play"></i> <b>MX Player</b>
        </a>

        <a onclick="vlc_player()" class="btn btn-primary flex-fill"
          style="border:none;background-color:{{ colours.vlc_player.background }};color:{{ colours.vlc_player.color }};">
          <i class="fa fa-play"></i> <b>VLC Player</b>
        </a>

        <a onclick="playit_player()" class="btn btn-primary flex-fill"
          style="border:none;background-color:{{ colours.playit_player.background }};color:{{ colours.playit_player.color }};">
          <i class="fa fa-play"></i> <b>Playit</b>
        </a>
      </div>

      <!-- Download -->
      <div class="row g-3 mb-2">
        <div class="col-md-6">
          <a onclick="streamDownload()" class="btn btn-success w-100"
            style="border:none;background-color:{{ colours.download.background }};color:{{ colours.download.color }};">
            <i class="fa-solid fa-download me-2"></i> Download
          </a>
        </div>
      </div>

      <!-- Telegram -->
      <a onclick="showLinkModal('{{tg_button}}')" class="btn btn-warning w-100 mb-2"
        style="border:none;background-color:{{ colours.create_link.background }};color:{{ colours.create_link.color }};">
        <i class="fa-brands fa-telegram"></i> Create Like This Link
      </a>

      <!-- Share -->
      <a onclick="shareButton()" class="btn btn-danger w-100 mb-3"
        style="border:none;background-color:{{ colours.share.background }};color:{{ colours.share.color }};">
        <i class="fa fa-share-alt"></i> Share Now
      </a>

      <!-- File Info -->
      <div class="card bg-dark text-light border-secondary mb-4"
        style="background-color:{{ colours.file_information.background }};color:{{ colours.file_information.color }};">
        <div class="card-header border-secondary">
          <h5 class="mb-0"><i class="fa-solid fa-circle-info me-2"></i> File Information</h5>
        </div>
        <div class="card-body">
          <p><strong>Name:</strong> {{file_name}}</p>
          <p><strong>Size:</strong> {{file_size}}</p>
        </div>
      </div>

      <!-- Disclaimer -->
      <div class="alert alert-warning"
        style="background-color:{{ colours.description.background }};color:{{ colours.description.color }};">
        <h6 class="fw-bold"><i class="fa-solid fa-triangle-exclamation me-2"></i> Disclaimer</h6>
        <p class="mb-0">{{disclaimer}}</p>
        <a href="{{report_link}}" class="report">Report</a>
      </div>

    </main>
  </div>

  <!-- 🔥 WORKING JAVASCRIPT (IMPORTANT PART) -->
  <script>
    const VIDEO_URL = "{{file_url}}";

    function mx_player() {
      window.location.href =
        "intent:" + VIDEO_URL +
        "#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end";
    }

    function vlc_player() {
      window.location.href =
        "intent:" + VIDEO_URL +
        "#Intent;package=org.videolan.vlc;type=video/*;end";
    }

    function playit_player() {
      window.location.href =
        "intent:" + VIDEO_URL +
        "#Intent;package=com.playit.videoplayer;type=video/*;end";
    }

    function streamDownload() {
      window.open(VIDEO_URL, "_blank");
    }

    function shareButton() {
      if (navigator.share) {
        navigator.share({ title: document.title, url: VIDEO_URL });
      } else {
        alert("Share not supported on this browser");
      }
    }

    function showLinkModal(link) {
      if (!link) {
        alert("Telegram link not set");
        return;
      }
      window.open(link, "_blank");
    }
  </script>

</body>
</html>
